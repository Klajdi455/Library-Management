<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LibraryOS — Management System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f0e0c;
    --paper: #f5f1ea;
    --cream: #ede8df;
    --accent: #c8402a;
    --accent2: #2a5fc8;
    --gold: #c89a2a;
    --success: #2a8a4a;
    --muted: #8a7f72;
    --border: #d4cfc6;
    --card: #ffffff;
    --sidebar-w: 240px;
    --radius: 6px;
    --shadow: 0 2px 12px rgba(15,14,12,0.08);
    --shadow-lg: 0 8px 32px rgba(15,14,12,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 0;
  }
  .login-card {
    background: var(--paper);
    border-radius: 12px;
    width: 420px;
    padding: 48px 44px 44px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    animation: slideUp 0.5s ease both;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  .login-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .login-logo span { color: var(--accent); }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 36px; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; }
  .login-role-tabs { display: flex; gap: 6px; margin-bottom: 24px; }
  .role-tab {
    flex: 1; padding: 8px 4px; border: 1.5px solid var(--border); border-radius: 6px;
    background: none; cursor: pointer; font-size: 12px; font-family: 'DM Mono', monospace;
    color: var(--muted); transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .role-tab.active { border-color: var(--accent); background: var(--accent); color: white; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius); background: var(--cream); font-size: 14px;
    font-family: 'Instrument Sans', sans-serif; color: var(--ink); outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent2); }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--ink); color: var(--paper);
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Instrument Sans', sans-serif; letter-spacing: 0.03em;
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-primary:hover { background: var(--accent); transform: translateY(-1px); }
  .login-hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 18px; font-family: 'DM Mono', monospace; }
  .login-hint strong { color: var(--ink); }

  /* ── LAYOUT ── */
  #app { display: none; height: 100vh; overflow: hidden; flex-direction: row; }
  #app.active { display: flex; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--ink); color: var(--paper);
    display: flex; flex-direction: column;
    padding: 0; height: 100vh; overflow-y: auto;
    position: relative;
  }
  .sidebar-header {
    padding: 28px 22px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; }
  .logo span { color: var(--accent); }
  .logo-sub { font-size: 10px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,0.35); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }
  .user-badge {
    margin: 16px 22px 0;
    padding: 10px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: var(--radius);
    font-size: 12px;
  }
  .user-badge .role-pill {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px;
    font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .role-admin { background: #c8402a22; color: #ff7a68; border: 1px solid #c8402a55; }
  .role-librarian { background: #2a5fc822; color: #7aadff; border: 1px solid #2a5fc855; }
  .role-member { background: #2a8a4a22; color: #7affa8; border: 1px solid #2a8a4a55; }
  .user-name { font-weight: 600; font-size: 13px; }
  .nav-section { padding: 20px 12px 8px; }
  .nav-label { font-size: 10px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.12em; padding: 0 10px 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius);
    cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.65);
    transition: all 0.15s; margin-bottom: 2px; user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: white; }
  .nav-item.active { background: var(--accent); color: white; }
  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
  .sidebar-footer {
    margin-top: auto; padding: 16px 22px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px; color: rgba(255,255,255,0.3);
    font-family: 'DM Mono', monospace;
  }
  .btn-logout {
    display: block; width: 100%; padding: 8px; margin-bottom: 10px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); color: rgba(255,255,255,0.6); cursor: pointer;
    font-size: 12px; font-family: 'Instrument Sans', sans-serif; transition: all 0.2s;
  }
  .btn-logout:hover { background: var(--accent); border-color: var(--accent); color: white; }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 58px; background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 28px; gap: 16px; flex-shrink: 0;
  }
  .topbar-title { font-family: 'DM Serif Display', serif; font-size: 20px; flex: 1; }
  .topbar-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--cream); border: 1.5px solid var(--border);
    border-radius: 30px; padding: 6px 14px; min-width: 220px;
  }
  .topbar-search input { border: none; background: none; outline: none; font-size: 13px; font-family: 'Instrument Sans', sans-serif; width: 100%; }
  .content { flex: 1; overflow-y: auto; padding: 28px; }

  /* ── CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 22px; position: relative; overflow: hidden;
    animation: fadeIn 0.4s ease both;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.accent1::before { background: var(--accent); }
  .stat-card.accent2::before { background: var(--accent2); }
  .stat-card.accent3::before { background: var(--gold); }
  .stat-card.accent4::before { background: var(--success); }
  .stat-card .label { font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
  .stat-card .value { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--ink); }
  .stat-card .icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 28px; opacity: 0.12; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ── SECTION ── */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Instrument Sans', sans-serif; border: none; transition: all 0.2s; }
  .btn-add { background: var(--ink); color: white; }
  .btn-add:hover { background: var(--accent); }
  .btn-secondary { background: var(--cream); color: var(--ink); border: 1.5px solid var(--border); }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-danger { background: #fdecea; color: var(--accent); border: 1.5px solid #f5c6c0; }
  .btn-danger:hover { background: var(--accent); color: white; }
  .btn-success { background: #e8f5ec; color: var(--success); border: 1.5px solid #b8dcbf; }
  .btn-success:hover { background: var(--success); color: white; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ── TABLE ── */
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 12px 16px; font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); text-align: left; background: var(--cream); }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover { background: var(--cream); }
  tbody td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px;
    font-family: 'DM Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge-available { background: #e8f5ec; color: var(--success); }
  .badge-borrowed { background: #fff3e0; color: #c87a2a; }
  .badge-reserved { background: #e3eef9; color: var(--accent2); }
  .badge-lost { background: #fdecea; color: var(--accent); }
  .badge-maintenance { background: #f5f0ff; color: #7a4ac8; }
  .badge-active { background: #e3eef9; color: var(--accent2); }
  .badge-overdue { background: #fdecea; color: var(--accent); }
  .badge-returned { background: #e8f5ec; color: var(--success); }
  .badge-pending { background: #fff3e0; color: #c87a2a; }
  .badge-ready { background: #e3eef9; color: var(--accent2); }
  .badge-fulfilled { background: #e8f5ec; color: var(--success); }
  .badge-cancelled { background: #f5f5f5; color: var(--muted); }
  .badge-paid { background: #e8f5ec; color: var(--success); }
  .badge-unpaid { background: #fdecea; color: var(--accent); }
  .badge-admin { background: #fdecea; color: var(--accent); }
  .badge-librarian { background: #e3eef9; color: var(--accent2); }
  .badge-member { background: #e8f5ec; color: var(--success); }
  .actions { display: flex; gap: 6px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,14,12,0.6);
    z-index: 200; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 12px; width: 520px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    animation: slideUp 0.25s ease both;
  }
  .modal-header {
    padding: 24px 28px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 4px; }
  .modal-close:hover { color: var(--ink); background: var(--cream); }
  .modal-body { padding: 24px 28px; }
  .modal-footer { padding: 16px 28px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 13px;
    font-family: 'Instrument Sans', sans-serif; color: var(--ink); outline: none;
    transition: border-color 0.2s; background: var(--cream);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent2); background: white; }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .full-width { grid-column: 1 / -1; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 2px; background: var(--cream); border-radius: 8px; padding: 4px; margin-bottom: 20px; width: fit-content; }
  .tab { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: white; color: var(--ink); box-shadow: var(--shadow); }

  /* ── SEARCH BAR ── */
  .search-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .search-bar input { flex: 1; padding: 9px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: 'Instrument Sans', sans-serif; outline: none; background: white; }
  .search-bar input:focus { border-color: var(--accent2); }
  .search-bar select { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: 'Instrument Sans', sans-serif; outline: none; background: white; color: var(--ink); }

  /* ── DASHBOARD ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .recent-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .recent-card h3 { font-family: 'DM Serif Display', serif; font-size: 16px; margin-bottom: 14px; }
  .activity-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .dot-borrow { background: var(--accent2); }
  .dot-return { background: var(--success); }
  .dot-fine { background: var(--accent); }
  .dot-reserve { background: var(--gold); }
  .activity-text { flex: 1; }
  .activity-time { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* ── NOTIFICATION TOAST ── */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    padding: 14px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease both;
    min-width: 280px; display: flex; align-items: center; gap: 10px;
    border-left: 4px solid transparent;
  }
  @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
  .toast-success { background: white; border-color: var(--success); }
  .toast-error { background: white; border-color: var(--accent); }
  .toast-info { background: white; border-color: var(--accent2); }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-family: 'DM Mono', monospace; font-size: 13px; }

  /* ── PAGES ── */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.3s ease both; }

  /* ── PROFILE ── */
  .profile-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 28px; margin-bottom: 16px; }
  .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: white; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 24px; flex-shrink: 0; }
  .profile-info h2 { font-family: 'DM Serif Display', serif; font-size: 22px; }
  .profile-info p { color: var(--muted); font-size: 13px; }
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .info-item label { font-size: 11px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); display: block; margin-bottom: 4px; }
  .info-item span { font-size: 14px; font-weight: 500; }
  .fine-alert { background: #fdecea; border: 1px solid #f5c6c0; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; color: var(--accent); font-size: 13px; display: flex; align-items: center; gap: 10px; }

  /* ── REPORTS ── */
  .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .report-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .report-card:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .report-card .icon { font-size: 28px; margin-bottom: 10px; }
  .report-card h4 { font-family: 'DM Serif Display', serif; font-size: 16px; margin-bottom: 6px; }
  .report-card p { font-size: 12px; color: var(--muted); }

  /* ── SETTINGS ── */
  .settings-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
  .settings-section h3 { font-family: 'DM Serif Display', serif; font-size: 17px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 13px; font-weight: 500; }
  .setting-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .setting-control input { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; width: 100px; outline: none; font-family: 'Instrument Sans', sans-serif; }
  .setting-control input:focus { border-color: var(--accent2); }

  /* ── AUDIT LOG ── */
  .audit-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; font-size: 13px; }
  .audit-item:last-child { border-bottom: none; }
  .audit-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 140px; flex-shrink: 0; }
  .audit-action { flex: 1; }
  .audit-user { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* ── MISC ── */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; background: var(--cream); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; font-family: 'DM Mono', monospace; }
  .text-muted { color: var(--muted); font-size: 12px; }
  .overdue-row td { background: #fdecea22; }
  .notification-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; display: inline-block; margin-left: 6px; vertical-align: middle; }
  .book-cover {
    width: 36px; height: 48px; border-radius: 3px; background: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-right: 10px; vertical-align: middle;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Library<span>OS</span></div>
    <div class="login-sub">Management System · 2025</div>
    <div class="login-role-tabs">
      <button class="role-tab active" onclick="selectRole('admin')">Admin</button>
      <button class="role-tab" onclick="selectRole('librarian')">Librarian</button>
      <button class="role-tab" onclick="selectRole('member')">Member</button>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@library.edu" value="admin@library.edu">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" value="password">
    </div>
    <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    <div class="login-hint">Demo: <strong>admin@library.edu</strong> · <strong>librarian@library.edu</strong> · <strong>member@library.edu</strong></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">Library<span>OS</span></div>
      <div class="logo-sub">Management System</div>
    </div>
    <div class="user-badge">
      <div class="role-pill" id="sb-role-pill">Admin</div>

// ── HELPERS ──
function getBook(id) { return db.books.find(b=>b.id===id); }
function getUser(id) { return db.users.find(u=>u.id===id); }
function getCopy(id) { return db.copies.find(c=>c.id===id); }
function getMember(userId) { return db.users.find(u=>u.id===userId && u.role==='member'); }
function getActiveCopies(bookId) { return db.copies.filter(c=>c.bookId===bookId && c.status==='available'); }
function getMemberBorrows(memberId) { return db.transactions.filter(t=>t.memberId===memberId && !t.returnDate); }
function dateStr(d) { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function today() { return new Date().toISOString().split('T')[0]; }
function daysOverdue(dueDate) {
  const due = new Date(dueDate); const now = new Date();
  const diff = Math.floor((now - due)/(1000*60*60*24));
  return diff > 0 ? diff : 0;
}
function addLog(action) {
  db.auditLog.unshift({ id: db.nextIds.audit++, userId: currentUser.id, action, timestamp: new Date().toISOString().replace('T',' ').slice(0,19) });
}

function renderDashboard() {
  const totalBooks = db.books.length;
  const totalCopies = db.copies.length;
  const activeBorrows = db.transactions.filter(t=>!t.returnDate).length;
  const overdue = db.transactions.filter(t=>!t.returnDate && t.status==='overdue').length;
  const members = db.users.filter(u=>u.role==='member').length;
  const unpaidFines = db.fines.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0);

  const myNotifs = getMyNotifications();
  const myBorrows = db.transactions.filter(t=>t.memberId===currentUser.id && !t.returnDate);
  const myFines = db.fines.filter(f=>f.memberId===currentUser.id && !f.paid);

  if (currentUser.role === 'member') {
    document.getElementById('content-area').innerHTML = `
      ${myFines.length ? `<div class="fine-alert">⚠️ You have outstanding fines totalling $${myFines.reduce((s,f)=>s+f.amount,0).toFixed(2)}. Please visit the library to settle.</div>` : ''}
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card accent2"><div class="label">Active Borrows</div><div class="value">${myBorrows.length}</div><div class="icon">📖</div></div>
        <div class="stat-card accent3"><div class="label">Outstanding Fines</div><div class="value">$${myFines.reduce((s,f)=>s+f.amount,0).toFixed(2)}</div><div class="icon">💰</div></div>
        <div class="stat-card accent4"><div class="label">Notifications</div><div class="value">${myNotifs.length}</div><div class="icon">🔔</div></div>
      </div>
      <div class="grid-2">
        <div class="recent-card">
          <h3>My Current Borrows</h3>
          ${myBorrows.length ? myBorrows.map(t=>{
            const copy = getCopy(t.copyId); const book = getBook(copy?.bookId);
            const od = daysOverdue(t.dueDate);
            return `<div class="activity-item">
              <div class="activity-dot ${od>0?'dot-fine':'dot-borrow'}"></div>
              <div class="activity-text"><strong>${book?.title||'Unknown'}</strong><br><span class="text-muted">Due: ${dateStr(t.dueDate)} ${od>0?`<span style="color:var(--accent)">(${od} days overdue)</span>`:''}</span></div>
            </div>`;
          }).join('') : '<div class="empty-state" style="padding:20px"><div class="icon">📚</div><p>No active borrows</p></div>'}
        </div>
        <div class="recent-card">
          <h3>Recent Notifications</h3>
          ${myNotifs.length ? myNotifs.slice(0,4).map(n=>`<div class="activity-item">
            <div class="activity-dot dot-reserve"></div>
            <div class="activity-text">${n.message}<br><span class="activity-time">${dateStr(n.sentDate)}</span></div>
          </div>`).join('') : '<div class="empty-state" style="padding:20px"><div class="icon">🔔</div><p>No notifications</p></div>'}
        </div>
      </div>`;
    return;
  }

  document.getElementById('content-area').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card accent1"><div class="label">Total Books</div><div class="value">${totalBooks}</div><div class="icon">📚</div></div>
      <div class="stat-card accent2"><div class="label">Active Borrows</div><div class="value">${activeBorrows}</div><div class="icon">🔄</div></div>
      <div class="stat-card accent3"><div class="label">Overdue</div><div class="value">${overdue}</div><div class="icon">⚠️</div></div>
      <div class="stat-card accent4"><div class="label">Members</div><div class="value">${members}</div><div class="icon">👤</div></div>
    </div>
    <div class="grid-2">
      <div class="recent-card">
        <h3>Recent Transactions</h3>
        ${db.transactions.slice(-5).reverse().map(t=>{
          const copy = getCopy(t.copyId); const book = getBook(copy?.bookId); const mem = getUser(t.memberId);
          const od = !t.returnDate && daysOverdue(t.dueDate);
          return `<div class="activity-item">
            <div class="activity-dot ${!t.returnDate?(od>0?'dot-fine':'dot-borrow'):'dot-return'}"></div>
            <div class="activity-text"><strong>${book?.title||'?'}</strong> — ${mem?.name||'?'}<br>
            <span class="text-muted">${t.returnDate?'Returned '+dateStr(t.returnDate):'Due '+dateStr(t.dueDate)+(od>0?` <span style="color:var(--accent)">(${od}d overdue)</span>`:'')} </span></div>
          </div>`;
        }).join('')}
      </div>
      <div class="recent-card">
        <h3>System Status</h3>
        <div class="activity-item"><div class="activity-dot dot-borrow"></div><div class="activity-text">Total Copies<br><span class="text-muted">${totalCopies} physical copies tracked</span></div></div>
        <div class="activity-item"><div class="activity-dot dot-return"></div><div class="activity-text">Available Copies<br><span class="text-muted">${db.copies.filter(c=>c.status==='available').length} ready for borrowing</span></div></div>
        <div class="activity-item"><div class="activity-dot dot-reserve"></div><div class="activity-text">Pending Reservations<br><span class="text-muted">${db.reservations.filter(r=>r.status==='pending').length} in queue</span></div></div>
        <div class="activity-item"><div class="activity-dot dot-fine"></div><div class="activity-text">Unpaid Fines<br><span class="text-muted">$${unpaidFines.toFixed(2)} outstanding</span></div></div>

      </div>
    </div>`;
}

function renderBooks(filter='') {
  const canManage = currentUser.role === 'admin';
  let books = db.books.filter(b =>
    !filter || b.title.toLowerCase().includes(filter) || b.author.toLowerCase().includes(filter) ||
    b.isbn.includes(filter) || (b.genre||'').toLowerCase().includes(filter)
  );
  document.getElementById('content-area').innerHTML = `
    <div class="section-header">
      <div class="section-title">Books & Catalog (${db.books.length})</div>
      ${canManage ? '<button class="btn btn-add" onclick="openAddBook()">+ Add Book</button>' : ''}
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search by title, author, ISBN, genre…" oninput="renderBooks(this.value.toLowerCase())" value="${filter}">
      <select onchange="filterByGenre(this.value)">
        <option value="">All Genres</option>
        ${[...new Set(db.books.map(b=>b.genre).filter(Boolean))].map(g=>`<option value="${g}">${g}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Book</th><th>Author</th><th>ISBN</th><th>Genre</th><th>Year</th><th>Copies</th><th>Available</th><th>Actions</th></tr></thead>
        <tbody>
          ${books.length ? books.map(b => {
            const avail = db.copies.filter(c=>c.bookId===b.id && c.status==='available').length;
            const total = db.copies.filter(c=>c.bookId===b.id).length;
            return `<tr>
              <td><strong>${b.title}</strong></td>
              <td>${b.author}</td>
              <td><code style="font-size:11px;background:var(--cream);padding:2px 6px;border-radius:3px">${b.isbn}</code></td>
              <td><span class="chip">${b.genre||'—'}</span></td>
              <td>${b.year}</td>
              <td>${total}</td>
              <td><span class="badge ${avail>0?'badge-available':'badge-borrowed'}">${avail}/${total}</span></td>
              <td><div class="actions">
                ${currentUser.role!=='admin' && avail>0 ? `<button class="btn btn-success btn-sm" onclick="quickBorrow(${b.id})">Borrow</button>` : ''}
                ${currentUser.role==='member' && avail===0 ? `<button class="btn btn-secondary btn-sm" onclick="quickReserve(${b.id})">Reserve</button>` : ''}
                ${canManage ? `<button class="btn btn-secondary btn-sm" onclick="openEditBook(${b.id})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteBook(${b.id})">Del</button>` : ''}
              </div></td>
            </tr>`;
          }).join('') : '<tr><td colspan="8"><div class="empty-state"><div class="icon">📚</div><p>No books found</p></div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

function filterByGenre(genre) {
  renderBooks(genre.toLowerCase());

function renderCopies(filter='') {
  const copies = db.copies.filter(c => {
    const book = getBook(c.bookId);
    return !filter || book?.title.toLowerCase().includes(filter) || c.status.includes(filter) || c.location.toLowerCase().includes(filter);
  });
  document.getElementById('content-area').innerHTML = `
    <div class="section-header">
      <div class="section-title">Book Copies (${db.copies.length})</div>
      ${currentUser.role==='admin'?'<button class="btn btn-add" onclick="openAddCopy()">+ Add Copy</button>':''}
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search by book, status, location…" oninput="renderCopies(this.value.toLowerCase())" value="${filter}">
      <select onchange="renderCopies(this.value)">
        <option value="">All Status</option>
        <option value="available">Available</option>
        <option value="borrowed">Borrowed</option>
        <option value="reserved">Reserved</option>
        <option value="maintenance">Maintenance</option>
        <option value="lost">Lost</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Copy ID</th><th>Book Title</th><th>Status</th><th>Location</th><th>Current Borrower</th>${currentUser.role==='admin'?'<th>Actions</th>':''}</tr></thead>
        <tbody>
          ${copies.length ? copies.map(c => {
            const book = getBook(c.bookId);
            const activeTrans = db.transactions.find(t=>t.copyId===c.id && !t.returnDate);
            const borrower = activeTrans ? getUser(activeTrans.memberId) : null;
            return `<tr>
              <td><code style="font-size:11px;background:var(--cream);padding:2px 6px;border-radius:3px">#${c.id}</code></td>
              <td>${book?.title||'?'}</td>
              <td><span class="badge badge-${c.status}">${c.status}</span></td>
              <td>${c.location}</td>
              <td>${borrower ? borrower.name : '<span class="text-muted">—</span>'}</td>
              ${currentUser.role==='admin'?`<td><div class="actions">
                <select class="btn btn-secondary btn-sm" style="padding:4px 8px" onchange="updateCopyStatus(${c.id},this.value);this.value='${c.status}'">
                  <option value="${c.status}" selected>Status ▾</option>
                  <option value="available">Available</option>
                  <option value="maintenance">Maintenance</option>
                  <option value="lost">Lost</option>
                </select>
                <button class="btn btn-danger btn-sm" onclick="deleteCopy(${c.id})">Del</button>
              </div></td>`:''}

        </tbody>
      </table>

function updateCopyStatus(copyId, newStatus) {
  const c = getCopy(copyId);
  if (!c) return;
  c.status = newStatus;
  addLog(`Updated copy #${copyId} status to ${newStatus}`);
  renderCopies(); showToast('Copy status updated','success');
}

function deleteCopy(id) {
  const c = getCopy(id);
  const active = db.transactions.find(t=>t.copyId===id && !t.returnDate);
  if (active) { showToast('Cannot delete — copy is currently borrowed','error'); return; }
  db.copies = db.copies.filter(c=>c.id!==id);
  addLog(`Deleted book copy #${id}`);
  renderCopies(); showToast('Copy removed','info');
}

function openIssueBook() {
  const members = db.users.filter(u=>u.role==='member');
  openModal('Issue Book to Member', `
    <div class="form-group"><label>Member *</label>
      <select id="f-memberId">
        <option value="">— Select Member —</option>
        ${members.map(m=>`<option value="${m.id}">${m.name} (${m.email})</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Book *</label>
      <select id="f-bookId" onchange="updateAvailCopies(this.value)">
        <option value="">— Select Book —</option>
        ${db.books.map(b => {
          const avail = db.copies.filter(c=>c.bookId===b.id&&c.status==='available').length;
          return `<option value="${b.id}" ${avail===0?'disabled':''} >${b.title} (${avail} available)</option>`;
        }).join('')}
      </select>
    </div>
    <div class="form-group"><label>Copy *</label>
      <select id="f-copyId"><option value="">— Select book first —</option></select>
    </div>
    <div class="form-group"><label>Due Date</label>
      <input id="f-dueDate" type="date" value="${new Date(Date.now()+db.settings.borrowDurationDays*86400000).toISOString().split('T')[0]}">
    </div>
  `, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Issue Book', cls:'btn-add', action:() => {
      const memberId = parseInt(document.getElementById('f-memberId').value);
      const copyId = parseInt(document.getElementById('f-copyId').value);
      const dueDate = document.getElementById('f-dueDate').value;
      if (!memberId||!copyId||!dueDate) { showToast('Please fill all fields','error'); return; }
      const activeBorrows = getMemberBorrows(memberId);
      if (activeBorrows.length >= db.settings.borrowLimit) { showToast(`Member has reached borrow limit (${db.settings.borrowLimit})`, 'error'); return; }
      const copy = getCopy(copyId);
      if (copy.status !== 'available') { showToast('Copy is not available','error'); return; }
      const tid = db.nextIds.transaction++;
      db.transactions.push({ id:tid, memberId, copyId, issuedBy:currentUser.id, issueDate:today(), dueDate, returnDate:null, status:'active' });
      copy.status = 'borrowed';
      addLog(`Issued copy #${copyId} (${getBook(copy.bookId)?.title}) to ${getUser(memberId)?.name}`);
      closeModalDirect(); renderBorrowing(); showToast('Book issued successfully!','success');
    }}
  ]);
}

function updateAvailCopies(bookId) {
  const sel = document.getElementById('f-copyId');
  if (!bookId) { sel.innerHTML = '<option value="">— Select book first —</option>'; return; }
  const copies = db.copies.filter(c=>c.bookId===parseInt(bookId)&&c.status==='available');
  sel.innerHTML = copies.length
    ? copies.map(c=>`<option value="${c.id}">Copy #${c.id} — ${c.location}</option>`).join('')
    : '<option value="">No available copies</option>';
}

                ${currentUser.role!=='member'?`<td><button class="btn btn-success btn-sm" onclick="processReturn(${t.id})">Return</button></td>`:''}
              </tr>`;

        </table>

    <div id="tab-returned" style="display:none">

        <table>

              const fine=db.fines.find(f=>f.transId===t.id);
              return `<tr><td><code style="font-size:11px;background:var(--cream);padding:2px 6px;border-radius:3px">#${t.id}</code></td>
              <td>${mem?.name||'?'}</td><td>${book?.title||'?'}</td><td>${dateStr(t.returnDate)}</td>
              <td>${fine?`<span class="badge badge-${fine.paid?'paid':'unpaid'}">Fine $${fine.amount.toFixed(2)}</span>`:'<span class="badge badge-returned">On Time</span>'}</td></tr>`;
            }).join('')||'<tr><td colspan="5"><div class="empty-state"><p>No returns yet</p></div></td></tr>'}
          </tbody>
        </table>
      </div>

}

function processReturn(transId) {
  const t = db.transactions.find(t=>t.id===transId);
  const copy = getCopy(t.copyId); const book = getBook(copy?.bookId); const mem = getUser(t.memberId);
  const od = daysOverdue(t.dueDate); const fine = (od*db.settings.fineRatePerDay).toFixed(2);
  openModal('Process Return', `
    <div style="background:var(--cream);border-radius:8px;padding:16px;margin-bottom:16px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px">Book</div>
      <div style="font-weight:600">${book?.title}</div>
      <div style="font-size:12px;color:var(--muted)">Copy #${copy?.id} — ${mem?.name}</div>
    </div>
    ${od>0 ? `<div class="fine-alert">⚠️ Overdue by ${od} day${od>1?'s':''}. Fine: <strong>$${fine}</strong> (@ $${db.settings.fineRatePerDay}/day)</div>` : '<div style="background:#e8f5ec;border:1px solid #b8dcbf;border-radius:8px;padding:12px;color:var(--success);font-size:13px">✓ Returned on time — no fine</div>'}
    <p style="margin-top:16px;font-size:13px;color:var(--muted)">Confirm return and close transaction?</p>
  `, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Confirm Return', cls:'btn-success', action:() => {
      t.returnDate = today(); t.status = 'returned';
      copy.status = 'available';
      if (od>0) {
        db.fines.push({ id:db.nextIds.fine++, transId, memberId:t.memberId, daysOverdue:od, amount:parseFloat(fine), paid:false, paidDate:null });
        const notifMsg = `Your return of "${book?.title}" had a fine of $${fine}. Please settle at the library.`;
        db.notifications.push({ id:db.nextIds.notification++, memberId:t.memberId, message:notifMsg, sentDate:today(), type:'overdue' });
      }
      // check reservations
      const nextRes = db.reservations.find(r=>r.bookId===book?.id && r.status==='pending');
      if (nextRes) {
        nextRes.status='ready'; nextRes.notified=true;
        db.notifications.push({ id:db.nextIds.notification++, memberId:nextRes.memberId, message:`"${book?.title}" is now available for pickup!`, sentDate:today(), type:'reservation' });
      }
      addLog(`Returned copy #${copy?.id} (${book?.title}) from ${mem?.name}${od>0?' — fine $'+fine:' — on time'}`);
      closeModalDirect(); renderReturns();
      showToast(od>0?`Returned — Fine of $${fine} recorded`:'Returned on time — no fine', od>0?'info':'success');
    }}
  ]);
}

function markReservationReady(id) {
  const r = db.reservations.find(r=>r.id===id);
  r.status='ready'; r.notified=true;
  const book=getBook(r.bookId); const mem=getUser(r.memberId);
  db.notifications.push({ id:db.nextIds.notification++, memberId:r.memberId, message:`"${book?.title}" is ready for pickup!`, sentDate:today(), type:'reservation' });
  addLog(`Marked reservation #${id} as ready for ${mem?.name}`);
  renderReservations(); showToast('Reservation marked ready & member notified','success');
}

function cancelReservation(id) {
  const r = db.reservations.find(r=>r.id===id);
  r.status='cancelled';
  addLog(`Cancelled reservation #${id}`);
  renderReservations(); showToast('Reservation cancelled','info');
}

function renderMembers(filter='') {
  const members = db.users.filter(u=>u.role==='member' && (!filter||u.name.toLowerCase().includes(filter)||u.email.toLowerCase().includes(filter)));
  document.getElementById('content-area').innerHTML = `
    <div class="section-header">
      <div class="section-title">Members (${db.users.filter(u=>u.role==='member').length})</div>
      <button class="btn btn-add" onclick="openAddMember()">+ Register Member</button>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search members…" oninput="renderMembers(this.value.toLowerCase())" value="${filter}">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Active Borrows</th><th>Fines</th><th>Actions</th></tr></thead>
        <tbody>
          ${members.length ? members.map(m=>{
            const borrows=getMemberBorrows(m.id).length;
            const fines=db.fines.filter(f=>f.memberId===m.id&&!f.paid).reduce((s,f)=>s+f.amount,0);
            return `<tr>
              <td><strong>${m.name}</strong></td>
              <td>${m.email}</td>
              <td>${m.phone||'—'}</td>
              <td>${dateStr(m.created)}</td>
              <td>${borrows > 0 ? `<span class="badge badge-active">${borrows}</span>` : '0'}</td>
              <td>${fines > 0 ? `<span class="badge badge-unpaid">$${fines.toFixed(2)}</span>` : '<span class="text-muted">None</span>'}</td>
              <td><div class="actions">
                <button class="btn btn-secondary btn-sm" onclick="openEditUser(${m.id})">Edit</button>
                ${currentUser.role==='admin'?`<button class="btn btn-danger btn-sm" onclick="deleteUser(${m.id})">Del</button>`:''}
              </div></td>
            </tr>`;
          }).join('') : '<tr><td colspan="7"><div class="empty-state"><div class="icon">👤</div><p>No members found</p></div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

function openAddMember() {
  openModal('Register New Member', `
    <div class="form-row">
      <div class="form-group"><label>Full Name *</label><input id="f-name" type="text" placeholder="Full name"></div>
      <div class="form-group"><label>Email *</label><input id="f-email" type="email" placeholder="email@example.com"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Password *</label><input id="f-pass" type="password" placeholder="Min 6 chars"></div>
      <div class="form-group"><label>Phone</label><input id="f-phone" type="text" placeholder="555-XXXX"></div>
    </div>
  `, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Register', cls:'btn-add', action:() => {
      const name=document.getElementById('f-name').value.trim();
      const email=document.getElementById('f-email').value.trim();
      const pass=document.getElementById('f-pass').value;
      if (!name||!email||!pass) { showToast('Name, email and password required','error'); return; }
      if (db.users.find(u=>u.email===email)) { showToast('Email already exists','error'); return; }
      if (pass.length<6) { showToast('Password must be at least 6 characters','error'); return; }
      db.users.push({ id:db.nextIds.user++, name, email, password:pass, role:'member', phone:document.getElementById('f-phone').value, created:today() });
      addLog(`Registered new member: ${name}`);
      closeModalDirect(); renderMembers(); showToast(`${name} registered!`,'success');
    }}
  ]);
}

function openEditUser(id) {
  const u = getUser(id);
  openModal('Edit User', `
    <div class="form-row">
      <div class="form-group"><label>Name</label><input id="f-name" type="text" value="${u.name}"></div>
      <div class="form-group"><label>Phone</label><input id="f-phone" type="text" value="${u.phone||''}"></div>
    </div>
    <div class="form-group"><label>New Password (leave blank to keep)</label><input id="f-pass" type="password" placeholder="New password…"></div>
  `, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Save', cls:'btn-add', action:() => {
      u.name=document.getElementById('f-name').value.trim()||u.name;
      u.phone=document.getElementById('f-phone').value;
      const np=document.getElementById('f-pass').value;
      if (np && np.length>=6) u.password=np;
      addLog(`Updated user profile: ${u.name}`);
      closeModalDirect(); navigate(currentPage); showToast('Profile updated','success');
    }}
  ]);
}

function deleteUser(id) {
  const u=getUser(id);
  const active=getMemberBorrows(id);
  if (active.length) { showToast('Cannot delete — member has active borrows','error'); return; }
  openModal('Delete User', `<p>Delete <strong>${u.name}</strong>? This cannot be undone.</p>`, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Delete', cls:'btn-danger', action:() => {
      db.users=db.users.filter(u=>u.id!==id);
      addLog(`Deleted user: ${u.name}`);
      closeModalDirect(); renderMembers(); showToast('User deleted','info');
    }}
  ]);
}

function renderFines() {
  const fines = currentUser.role==='member' ? db.fines.filter(f=>f.memberId===currentUser.id) : db.fines;
  document.getElementById('content-area').innerHTML = `
    <div class="section-header">
      <div class="section-title">Fines</div>
    </div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat-card accent1"><div class="label">Total Fines</div><div class="value">${fines.length}</div><div class="icon">💰</div></div>
      <div class="stat-card accent3"><div class="label">Unpaid</div><div class="value">$${fines.filter(f=>!f.paid).reduce((s,f)=>s+f.amount,0).toFixed(2)}</div><div class="icon">⚠️</div></div>
      <div class="stat-card accent4"><div class="label">Collected</div><div class="value">$${fines.filter(f=>f.paid).reduce((s,f)=>s+f.amount,0).toFixed(2)}</div><div class="icon">✓</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fine ID</th>${currentUser.role!=='member'?'<th>Member</th>':''}<th>Book</th><th>Days Overdue</th><th>Amount</th><th>Status</th>${currentUser.role!=='member'?'<th>Action</th>':''}</tr></thead>
        <tbody>
          ${fines.length ? fines.map(f=>{
            const t=db.transactions.find(t=>t.id===f.transId);
            const copy=t?getCopy(t.copyId):null; const book=copy?getBook(copy.bookId):null;
            const mem=getUser(f.memberId);
            return `<tr>
              <td><code style="font-size:11px;background:var(--cream);padding:2px 6px;border-radius:3px">#${f.id}</code></td>
              ${currentUser.role!=='member'?`<td>${mem?.name||'?'}</td>`:''}
              <td>${book?.title||'?'}</td>
              <td>${f.daysOverdue}</td>
              <td><strong>$${f.amount.toFixed(2)}</strong></td>
              <td><span class="badge badge-${f.paid?'paid':'unpaid'}">${f.paid?'Paid':'Unpaid'}</span></td>
              ${currentUser.role!=='member'?`<td>${!f.paid?`<button class="btn btn-success btn-sm" onclick="markFinePaid(${f.id})">Mark Paid</button><button class="btn btn-secondary btn-sm" onclick="waiveFine(${f.id})">Waive</button>`:'<span class="text-muted">—</span>'}</td>`:''}
            </tr>`;
          }).join('') : '<tr><td colspan="7"><div class="empty-state"><div class="icon">💰</div><p>No fines</p></div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

function markFinePaid(id) {
  const f = db.fines.find(f=>f.id===id);
  f.paid=true; f.paidDate=today();
  addLog(`Fine #${id} marked as paid ($${f.amount.toFixed(2)})`);
  renderFines(); showToast(`Fine of $${f.amount.toFixed(2)} marked as paid`,'success');
}

function waiveFine(id) {
  const f=db.fines.find(f=>f.id===id);
  openModal('Waive Fine', `<p>Waive fine of <strong>$${f.amount.toFixed(2)}</strong> for ${getUser(f.memberId)?.name}?</p>`, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Waive', cls:'btn-success', action:() => {
      f.paid=true; f.paidDate=today(); f.amount=0;
      addLog(`Waived fine #${id}`);
      closeModalDirect(); renderFines(); showToast('Fine waived','info');
    }}
  ]);
}

      <div class="report-card" onclick="showReport('members')"><div class="icon">👤</div><h4>Members Report</h4><p>Activity, borrows, fines</p></div>
      <div class="report-card" onclick="showReport('transactions')"><div class="icon">🔄</div><h4>Transactions</h4><p>All borrowing history</p></div>
      <div class="report-card" onclick="showReport('fines')"><div class="icon">💰</div><h4>Fines Report</h4><p>Overdue, collected, outstanding</p></div>
      <div class="report-card" onclick="showReport('overdue')"><div class="icon">⚠️</div><h4>Overdue Report</h4><p>Currently overdue books</p></div>
      <div class="report-card" onclick="showReport('inventory')"><div class="icon">📋</div><h4>Inventory Report</h4><p>Copy availability by status</p></div>
    </div>
    <div id="report-output"></div>`;
}

function showReport(type) {
  const el = document.getElementById('report-output');
  const now = new Date().toLocaleString();
  let html = `<div class="recent-card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3>${type.charAt(0).toUpperCase()+type.slice(1)} Report</h3><span class="text-muted" style="font-family:'DM Mono',monospace;font-size:11px">Generated: ${now}</span></div>`;

  if (type==='books') {
    const byGenre = {};
    db.books.forEach(b=>{ byGenre[b.genre||'Unknown']=(byGenre[b.genre||'Unknown']||0)+1; });
    html += `<div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="stat-card accent1"><div class="label">Total Titles</div><div class="value">${db.books.length}</div></div>
      <div class="stat-card accent2"><div class="label">Total Copies</div><div class="value">${db.copies.length}</div></div>
      <div class="stat-card accent3"><div class="label">Available</div><div class="value">${db.copies.filter(c=>c.status==='available').length}</div></div>
      <div class="stat-card accent4"><div class="label">Genres</div><div class="value">${Object.keys(byGenre).length}</div></div>
    </div>
    <table><thead><tr><th>Genre</th><th>Titles</th></tr></thead><tbody>
      ${Object.entries(byGenre).map(([g,c])=>`<tr><td>${g}</td><td>${c}</td></tr>`).join('')}
    </tbody></table>`;
  } else if (type==='members') {
    const members = db.users.filter(u=>u.role==='member');
    html += `<table><thead><tr><th>Name</th><th>Active Borrows</th><th>Total Borrows</th><th>Fines</th></tr></thead><tbody>
      ${members.map(m=>{
        const active=getMemberBorrows(m.id).length;
        const total=db.transactions.filter(t=>t.memberId===m.id).length;
        const fines=db.fines.filter(f=>f.memberId===m.id&&!f.paid).reduce((s,f)=>s+f.amount,0);
        return `<tr><td>${m.name}</td><td>${active}</td><td>${total}</td><td>${fines>0?'$'+fines.toFixed(2):'—'}</td></tr>`;
      }).join('')}
    </tbody></table>`;
  } else if (type==='transactions') {
    html += `<table><thead><tr><th>ID</th><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th></tr></thead><tbody>
      ${db.transactions.map(t=>{
        const copy=getCopy(t.copyId);const book=getBook(copy?.bookId);const mem=getUser(t.memberId);
        return `<tr><td>#${t.id}</td><td>${mem?.name||'?'}</td><td>${book?.title||'?'}</td><td>${dateStr(t.issueDate)}</td><td>${dateStr(t.dueDate)}</td><td>${t.returnDate?dateStr(t.returnDate):'—'}</td><td><span class="badge badge-${daysOverdue(t.dueDate)>0&&!t.returnDate?'overdue':t.returnDate?'returned':'active'}">${daysOverdue(t.dueDate)>0&&!t.returnDate?'Overdue':t.returnDate?'Returned':'Active'}</span></td></tr>`;
      }).join('')}
    </tbody></table>`;
  } else if (type==='fines') {
    const total=db.fines.reduce((s,f)=>s+f.amount,0);
    const paid=db.fines.filter(f=>f.paid).reduce((s,f)=>s+f.amount,0);
    html += `<div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="stat-card accent1"><div class="label">Total Fines</div><div class="value">$${total.toFixed(2)}</div></div>
      <div class="stat-card accent4"><div class="label">Collected</div><div class="value">$${paid.toFixed(2)}</div></div>
      <div class="stat-card accent3"><div class="label">Outstanding</div><div class="value">$${(total-paid).toFixed(2)}</div></div>
    </div>`;
  } else if (type==='overdue') {
    const overdue=db.transactions.filter(t=>!t.returnDate&&daysOverdue(t.dueDate)>0);
    html += `<table><thead><tr><th>Member</th><th>Book</th><th>Due Date</th><th>Days Overdue</th><th>Fine Accrued</th></tr></thead><tbody>
      ${overdue.map(t=>{const copy=getCopy(t.copyId);const book=getBook(copy?.bookId);const mem=getUser(t.memberId);const od=daysOverdue(t.dueDate);
        return `<tr style="background:#fdecea22"><td>${mem?.name||'?'}</td><td>${book?.title||'?'}</td><td>${dateStr(t.dueDate)}</td><td style="color:var(--accent);font-weight:600">${od}</td><td style="color:var(--accent)">$${(od*db.settings.fineRatePerDay).toFixed(2)}</td></tr>`;
      }).join('')||'<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--success)">No overdue books!</td></tr>'}
    </tbody></table>`;
  } else if (type==='inventory') {
    const statuses=['available','borrowed','reserved','maintenance','lost'];
    html += `<table><thead><tr><th>Status</th><th>Count</th><th>%</th></tr></thead><tbody>
      ${statuses.map(s=>{
        const cnt=db.copies.filter(c=>c.status===s).length;
        const pct=((cnt/db.copies.length)*100).toFixed(1);
        return `<tr><td><span class="badge badge-${s}">${s}</span></td><td>${cnt}</td><td>${pct}%</td></tr>`;
      }).join('')}
    </tbody></table>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

        <thead><tr><th>Book</th><th>Copy</th><th>Issue Date</th><th>Due Date</th><th>Returned</th><th>Status</th></tr></thead>
        <tbody>
          ${borrows.length ? borrows.reverse().map(t=>{
            const copy=getCopy(t.copyId);const book=getBook(copy?.bookId);
            const od=!t.returnDate&&daysOverdue(t.dueDate);
            return `<tr class="${od>0?'overdue-row':''}">
              <td><strong>${book?.title||'?'}</strong></td>
              <td>#${t.copyId}</td>
              <td>${dateStr(t.issueDate)}</td>
              <td>${dateStr(t.dueDate)}</td>
              <td>${t.returnDate?dateStr(t.returnDate):'<span class="text-muted">Not returned</span>'}</td>
              <td><span class="badge badge-${od>0?'overdue':t.returnDate?'returned':'active'}">${od>0?'Overdue':t.returnDate?'Returned':'Active'}</span>
              ${od>0?`<br><span style="font-size:11px;color:var(--accent)">${od} days — $${(od*db.settings.fineRatePerDay).toFixed(2)}</span>`:''}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="6"><div class="empty-state"><div class="icon">📚</div><p>No borrow history</p></div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

function renderMyReservations() {
  renderReservations();
}

function renderMyFines() {
  renderFines();
}

function getMyNotifications() {
  return db.notifications.filter(n=>n.memberId===currentUser.id);
}

function renderNotifications() {
  const notifs = getMyNotifications();
  document.getElementById('content-area').innerHTML = `
    <div class="section-header"><div class="section-title">Notifications (${notifs.length})</div></div>
    <div class="table-wrap">
      ${notifs.length ? notifs.map(n=>`
        <div class="audit-item">
          <div class="activity-dot ${n.type==='reservation'?'dot-reserve':n.type==='overdue'?'dot-fine':'dot-borrow'}" style="width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;${n.type==='reservation'?'background:var(--gold)':n.type==='overdue'?'background:var(--accent)':'background:var(--accent2)'}"></div>
          <div class="audit-action">${n.message}</div>
          <div class="audit-time">${dateStr(n.sentDate)}</div>
        </div>`).join('') : '<div class="empty-state"><div class="icon">🔔</div><p>No notifications</p></div>'}
    </div>`;
}

// ══════════════════════════════════════════════════════
// GLOBAL SEARCH
// ══════════════════════════════════════════════════════
function globalSearch(q) {
  if (!q || q.length < 2) return;
  const ql = q.toLowerCase();
  const books = db.books.filter(b=>b.title.toLowerCase().includes(ql)||b.author.toLowerCase().includes(ql)||b.isbn.includes(ql));
  if (books.length > 0) {
    currentPage = 'books';
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    const navEl = document.getElementById('nav-books');
    if (navEl) navEl.classList.add('active');
    renderBooks(ql);
  }
}

// ══════════════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════════════
function openModal(title, bodyHtml, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = buttons.map((b,i) => `<button class="btn ${b.cls}" data-idx="${i}">${b.label}</button>`).join('');
  footer.querySelectorAll('button').forEach(btn => {
    const b = buttons[parseInt(btn.dataset.idx)];
    btn.onclick = () => { if (b.action==='close') closeModalDirect(); else b.action(); };
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) { if (e.target===document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }

// ══════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════
function switchTab(el, activeId) {
  el.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const siblings = el.closest('.tabs');
  let next = siblings.nextElementSibling;
  while (next) {
    next.style.display = next.id === activeId ? 'block' : 'none';
    next = next.nextElementSibling;
  }
}

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
function showToast(msg, type='success') {
  const icons = { success:'✓', error:'✕', info:'ℹ' };
  const tc = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span>${icons[type]||'•'}</span>${msg}`;
  tc.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

// ── Return modal shortcut ──
function openReturnBook() {
  const active = db.transactions.filter(t=>!t.returnDate);
  openModal('Select Transaction to Return', `
    <div class="form-group"><label>Transaction</label>
      <select id="f-transId">
        <option value="">— Select —</option>
        ${active.map(t=>{
          const copy=getCopy(t.copyId);const book=getBook(copy?.bookId);const mem=getUser(t.memberId);
          return `<option value="${t.id}">#${t.id} — ${mem?.name||'?'} / ${book?.title||'?'}</option>`;
        }).join('')}
      </select>
    </div>
  `, [
    { label:'Cancel', cls:'btn-secondary', action:'close' },
    { label:'Continue', cls:'btn-add', action:() => {
      const id=parseInt(document.getElementById('f-transId').value);
      if (!id) { showToast('Select a transaction','error'); return; }
      closeModalDirect(); processReturn(id);
    }}
  ]);
}
